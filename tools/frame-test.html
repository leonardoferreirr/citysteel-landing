<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame3d: teste</title>
<style>
  :root { --bg:#0A0A0B; --surface:#111113; --line:#232327; --fg:#F4F2EF; --muted:#9B9BA3; --accent:#FF6A13; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, Menlo, monospace; }
  #stage { position:fixed; inset:0; }
  canvas { width:100%; height:100%; display:block; }
  #ui { position:fixed; left:16px; bottom:16px; width:min(380px, calc(100vw - 32px)); background:rgba(17,17,19,.92); border:1px solid var(--line); border-radius:8px; padding:12px 14px; z-index:5; }
  #ui.hide { display:none; }
  label { display:flex; gap:10px; align-items:center; margin:6px 0; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  button { background:var(--surface); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #info { color:var(--muted); white-space:pre; margin-top:8px; }
  #guide { position:fixed; top:0; bottom:0; left:40%; width:1px; background:rgba(255,106,19,.25); pointer-events:none; display:none; }
  #guide.on { display:block; }
  .phase { color:var(--muted); font-size:11px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-hidden="true"></canvas></div>
<div id="guide"></div>
<div id="ui">
  <div class="phase"><span>projeto 0-.25</span><span>estrutura .25-.60</span><span>fachada .60-.85</span><span>pronta</span></div>
  <label><span>p</span><input id="p" type="range" min="0" max="1" step="0.001" value="0"><span id="pv">0.000</span></label>
  <label>
    <button id="play">simular scroll 0→1 (12 s)</button>
    <button id="guideBtn">guia 40%</button>
    <button id="remount">remontar</button>
  </label>
  <label><input id="mob" type="checkbox"> mobile (menos perfis, dpr 1.25)</label>
  <label><input id="red" type="checkbox"> reduced motion (sem intro/parallax)</label>
  <div id="info">montando…</div>
</div>
<script type="module">
  import { mountFrame, PHASES, INTRO_END } from '../assets/js/frame3d.js';
  const q = new URLSearchParams(location.search);
  const poster = q.get('poster') === '1';
  const p0 = q.has('p') ? parseFloat(q.get('p')) : 0;
  const ui = document.getElementById('ui');
  if (poster || q.get('ui') === '0') ui.classList.add('hide');
  const mob = document.getElementById('mob'), red = document.getElementById('red');
  mob.checked = q.get('mobile') === '1' || (!q.has('mobile') && matchMedia('(max-width: 760px)').matches);
  red.checked = q.get('reduced') === '1' || (!q.has('reduced') && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const canvas = document.getElementById('c');
  const range = document.getElementById('p'), pv = document.getElementById('pv'), info = document.getElementById('info');
  let frame = null, timer = 0;
  async function mount() {
    if (frame) { frame.dispose(); frame = null; }
    window.__frameReady = false;
    const t0 = performance.now();
    frame = await mountFrame(canvas, { mobile: mob.checked, reducedMotion: red.checked, poster, debug: true });
    frame.setProgress(p0);
    range.value = p0; pv.textContent = p0.toFixed(3);
    await frame.ready;
    const dt = performance.now() - t0;
    window.__frame = frame;
    window.__frameReady = true;
    const tickInfo = () => {
      if (!frame) return;
      const i = frame.info();
      info.textContent = `mount+1º quadro: ${dt.toFixed(0)} ms\ndraw calls: ${i.drawCalls}  segmentos: ${i.segments}\ndpr: ${i.dpr}  canvas: ${i.size.join('x')}\nprogress: ${i.progress.toFixed(3)}  timeline: ${i.timeline.toFixed(3)}\nINTRO_END ${INTRO_END}  fases ${JSON.stringify(PHASES)}`;
    };
    tickInfo(); clearInterval(timer); timer = setInterval(tickInfo, 250);
  }
  range.addEventListener('input', () => { pv.textContent = (+range.value).toFixed(3); frame && frame.setProgress(+range.value); });
  document.getElementById('play').addEventListener('click', () => {
    const start = performance.now(), dur = 12000;
    const step = (now) => { const u = Math.min(1, (now - start) / dur); range.value = u; pv.textContent = u.toFixed(3); frame && frame.setProgress(u); if (u < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.getElementById('guideBtn').addEventListener('click', () => document.getElementById('guide').classList.toggle('on'));
  document.getElementById('remount').addEventListener('click', mount);
  mob.addEventListener('change', mount); red.addEventListener('change', mount);
  mount();
</script>
</body>
</html>
